services:
  - type: web
    name: cyphermed-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SIWX_ALLOWED_ORIGINS
        value: https://cyphermed.vercel.app
      - key: TRUST_PROXY_HOPS
        value: "1"